services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: polar_dss
      POSTGRES_USER: polar
      POSTGRES_PASSWORD: polar
    ports:
      - "5432:5432"
    volumes:
      - polar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polar -d polar_dss"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql+psycopg://polar:polar@postgres:5432/polar_dss
      CORS_ORIGINS: '["http://localhost:3000"]'
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  polar_postgres_data:
